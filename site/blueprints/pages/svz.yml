title: SVZ
preset: page
fields:
  headline: fields/headline
  text:
    type: textarea
    required: true
    label: Einleitung
    size: medium
    help: Kurzer Einleitungstext im Bereich "Infos".
  highlightsHeadline:
    type: headline
    label: Kennzahlen (Titelbild)
  highlights:
    type: structure
    label: Kennzahlen
    help: Die ersten Einträge erscheinen als Kennzahlen im Titelbild, z.B. "165 m²" - "Fläche".
    columns:
      value:
        width: 1/4
      label:
        width: 3/4
    fields:
      value:
        type: text
        required: true
        label: Wert
        width: 1/3
      label:
        type: text
        required: true
        label: Beschriftung
        width: 2/3
  featuresHeadline:
    type: headline
    label: Bereich "Infos"
  features:
    type: structure
    label: Highlights (Karten)
    help: Als Icon einen Font-Awesome-4-Namen eintragen, z.B. "fa-cutlery" oder "fa-wifi".
    columns:
      icon:
        width: 1/6
      title:
        width: 1/3
    fields:
      icon:
        type: text
        required: true
        label: Icon
        width: 1/3
      title:
        type: text
        required: true
        label: Titel
        width: 2/3
      text:
        type: textarea
        required: true
        label: Text
        size: small
  facts:
    type: textarea
    required: true
    label: Fakten (Kurz und knackig)
    help: Als Liste mit "- " eintragen. Wird als Checkliste dargestellt.
  gallery:
    label: Bildergalerie
    type: files
    multiple: true
    help: Das erste Bild wird groß dargestellt. Zum Bearbeiten der Bildbeschreibungen Bild anklicken.
  quotes:
    label: Stimmen
    type: structure
    fields:
      quote:
        type: textarea
        required: true
        label: Stimme
  availabilityHeadline:
    type: headline
    label: Bereich "Verfügbarkeit"
  availabilityText:
    type: textarea
    label: Text über dem Kalender
    size: small
  pricesHeadline:
    type: headline
    label: Bereich "Preise"
  prices:
    type: structure
    label: Preise
    help: Je Paket und Raum eine Zeile. Beim Raumpaket ist der Mindestverzehr 0. Die Gesamtsumme wird automatisch berechnet.
    columns:
      package:
        width: 1/4
      room:
        width: 1/4
      rent:
        width: 1/8
      minimum:
        width: 1/8
      memberrent:
        width: 1/8
    fields:
      package:
        type: select
        required: true
        label: Paket
        width: 1/2
        options:
          gesamt: Gesamtpaket
          raum: Raumpaket
      room:
        type: select
        required: true
        label: Raum
        width: 1/2
        options:
          klein: Kleiner Wirtschaftsraum
          gross: Großer Wirtschaftsraum
      rent:
        type: number
        required: true
        label: Raummiete (€)
        step: 0.01
        width: 1/3
      minimum:
        type: number
        label: Mindestverzehr (€)
        step: 0.01
        default: 0
        width: 1/3
      memberrent:
        type: number
        required: true
        label: Raummiete aktive Mitglieder (€)
        step: 0.01
        width: 1/3
  priceNotes:
    type: textarea
    label: Hinweise zu den Preisen
    size: small
files:
  fields:
    type: files
