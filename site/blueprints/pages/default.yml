title: Leere Seite
columns:
  main:
    width: 2/3
    fields:
      headline:
        extends: fields/headline
        required: false
        help: Überschrift oberhalb des Inhalts (optional)
      blocks:
        label: Inhalt
        type: blocks
        empty: Noch kein Inhalt. Mit dem Plus lassen sich Überschriften, Texte, Bilder, Spalten und mehr hinzufügen.
        fieldsets:
          text:
            label: Text
            type: group
            fieldsets:
              - heading
              - text
              - list
              - quote
          media:
            label: Medien
            type: group
            fieldsets:
              - image
              - textimage
              - gallery
              - video
          layout:
            label: Layout
            type: group
            fieldsets:
              - columns
              - line
              - spacer
          extras:
            label: Weitere
            type: group
            fieldsets:
              - button
              - notice
              - accordion
  sidebar:
    width: 1/3
    fields:
      pages:
        label: Seiten
        type: pagelist
        status: all
        layout: list
      files:
        label: Dateien
        type: filelist
        layout: list
