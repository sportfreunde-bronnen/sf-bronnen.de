title: Individuelle Seite
columns:
  main:
    width: 2/3
    fields:
      folder:
        label: Ist diese Seite eine übergeordnete Seite und soll in der Navigation lediglich als "Ordner" fungieren?
        help: Zum Beispiel wie bei "Allgemeines".
        type: toggle
        default: true
        text:
          - "Nein"
          - "Ja"
      line:
        type: line
        when:
          folder: false
      headline:
        extends: fields/headline
        required: false
        help: Überschrift oberhalb des Inhalts (optional)
        when:
          folder: false
      blocks:
        label: Inhalt
        type: blocks
        empty: Noch kein Inhalt. Mit dem Plus lassen sich Überschriften, Texte, Bilder, Spalten und mehr hinzufügen.
        when:
          folder: false
        fieldsets:
          text:
            label: Text
            type: group
            fieldsets:
              - heading
              - text
              - list
              - quote
          media:
            label: Medien
            type: group
            fieldsets:
              - image
              - textimage
              - gallery
              - video
          layout:
            label: Layout
            type: group
            fieldsets:
              - columns
              - line
              - spacer
          extras:
            label: Weitere
            type: group
            fieldsets:
              - button
              - notice
              - accordion
  sidebar:
    width: 1/3
    fields:
      pages:
        label: Seiten
        type: pagelist
        status: all
        layout: list
        create:
          - default
          - infos
          - downloads
          - chronik
          - veranstaltungen
      files:
        label: Dateien
        type: filelist
        layout: list
